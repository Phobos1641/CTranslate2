name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - master

jobs:
  build-and-test-cpp-x86_64:
    runs-on: ${{ matrix.os }}
    env:
      CT2_VERBOSE: 1
    strategy:
      matrix:
        os: [ubuntu-24.04]
        backend: [mkl, dnnl]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Purge existing CUDA / NVIDIA packages
        shell: bash
        run: |
          sudo apt-get remove --purge -y \
            'cuda*' \
            'libcuda*' \
            'libnvidia*' \
            'nvidia-cuda*' \
            'libcublas*' \
            'libcufft*' \
            'libcurand*' \
            'libcusolver*' \
            'libcusparse*' \
            'libnvjpeg*' \
            'libnpp*' || true
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          sudo rm -rf \
            /usr/local/cuda* \
            /usr/lib/x86_64-linux-gnu/libcuda* \
            /usr/lib/x86_64-linux-gnu/libcublas* \
            /etc/apt/sources.list.d/cuda* \
            /etc/apt/sources.list.d/nvidia*
          sudo apt-get update

      - name: Add NVIDIA CUDA repository
        shell: bash
        run: |
          UBUNTU_VERSION=$(lsb_release -rs 2>/dev/null | tr -d '.')
          CUDA_REPO_URL="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${UBUNTU_VERSION}/x86_64"
          wget -q "${CUDA_REPO_URL}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update

      - name: Install CUDA 13.2
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            cuda-13-2 \
            cuda-libraries-dev-13-2 \
            libcublas-13-2 libcublas13-dev-cuda-13 \
            cudnn9-cuda-13 libcudnn9-dev-cuda-13 \
            libnccl2 libnccl-dev

      - name: Add CUDA to PATH and LD_LIBRARY_PATH
        shell: bash
        run: |
          CUDA_PATH=/usr/local/cuda-13.2
          echo "CUDA_HOME=$CUDA_PATH"  >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CUDA_PATH"  >> "$GITHUB_ENV"
          echo "$CUDA_PATH/bin"        >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify CUDA installation
        shell: bash
        run: |
          nvcc --version
          echo "CUDA_HOME=$CUDA_HOME"
          ldconfig -p | grep -E "cudnn|nccl|cudart" | head
          dpkg -l | grep -E 'cuda|cublas|cudnn'

      - name: Setup Intel oneAPI
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Configure MKL
        if: matrix.backend == 'mkl'
        env:
          CT2_USE_MKL: 1
          MKL_VERSION: 2023.0.0
        run: |
          sudo apt-get install -y intel-oneapi-mkl-devel-$MKL_VERSION
          cmake -DCMAKE_INSTALL_PREFIX=$PWD/install -DBUILD_TESTS=ON .

      - name: Configure with DNNL
        if: matrix.backend == 'dnnl'
        env:
          DNNL_VERSION: 2023.0.0-25399
        run: |
          sudo apt-get install -y intel-oneapi-dnnl-devel=$DNNL_VERSION intel-oneapi-dnnl=$DNNL_VERSION
          cmake -DCMAKE_INSTALL_PREFIX=$PWD/install -DBUILD_TESTS=ON -DWITH_MKL=OFF -DOPENMP_RUNTIME=COMP -DWITH_DNNL=ON .

      - name: Build
        run: |
          make -j $(nproc) install

      - name: Download test data
        working-directory: tests/data/models
        run: |
          wget https://opennmt-models.s3.amazonaws.com/pi_lm_step_5000.pt
          wget https://opennmt-models.s3.amazonaws.com/transliteration-aren-all.tar.gz
          tar xf transliteration-aren-all.tar.gz

      - name: Test MKL
        if: matrix.backend == 'mkl'
        env:
          CT2_USE_MKL: 1
        run: |
          tests/ctranslate2_test tests/data
      - name: Test DNNL
        if: matrix.backend == 'dnnl'
        run: |
          tests/ctranslate2_test tests/data
          
  build-and-test-cpp-x86_64-address_sanitizer:
    runs-on: ubuntu-24.04
    env:
      CT2_VERBOSE: 1

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Purge existing CUDA / NVIDIA packages
        shell: bash
        run: |
          sudo apt-get remove --purge -y \
            'cuda*' \
            'libcuda*' \
            'libnvidia*' \
            'nvidia-cuda*' \
            'libcublas*' \
            'libcufft*' \
            'libcurand*' \
            'libcusolver*' \
            'libcusparse*' \
            'libnvjpeg*' \
            'libnpp*' || true
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          sudo rm -rf \
            /usr/local/cuda* \
            /usr/lib/x86_64-linux-gnu/libcuda* \
            /usr/lib/x86_64-linux-gnu/libcublas* \
            /etc/apt/sources.list.d/cuda* \
            /etc/apt/sources.list.d/nvidia*
          sudo apt-get update

      - name: Add NVIDIA CUDA repository
        shell: bash
        run: |
          CUDA_REPO_URL="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64"
          wget -q "${CUDA_REPO_URL}/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update

      - name: Install CUDA 13.2
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            cuda-13-2 \
            cuda-libraries-dev-13-2 \
            libcublas-13-2 libcublas13-dev-cuda-13 \
            cudnn9-cuda-13 libcudnn9-dev-cuda-13 \
            libnccl2 libnccl-dev

      - name: Add CUDA to PATH and LD_LIBRARY_PATH
        shell: bash
        run: |
          CUDA_PATH=/usr/local/cuda-13.2
          echo "CUDA_HOME=$CUDA_PATH"  >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CUDA_PATH"  >> "$GITHUB_ENV"
          echo "$CUDA_PATH/bin"        >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify CUDA installation
        shell: bash
        run: |
          nvcc --version
          echo "CUDA_HOME=$CUDA_HOME"
          ldconfig -p | grep -E "cudnn|nccl|cudart" | head
          dpkg -l | grep -E 'cuda|cublas|cudnn'

      - name: Setup Intel oneAPI
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update

      - name: Install MKL
        env:
          CT2_USE_MKL: 1
          MKL_VERSION: 2023.0.0
        run: |
          sudo apt-get install -y intel-oneapi-mkl-devel-$MKL_VERSION

      - name: Install Clang
        run: |
          sudo apt-get install -y clang

      - name: Configure with MKL and Clang
        env:
          CT2_USE_MKL: 1
        run: |
          cmake -DCMAKE_INSTALL_PREFIX=$PWD/install -DBUILD_TESTS=ON -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DENABLE_ADDRESS_SANITIZER=ON -DCMAKE_BUILD_TYPE=Debug .

      - name: Build
        run: |
          make -j $(nproc) install

      - name: Download test data
        working-directory: tests/data/models
        run: |
          wget https://opennmt-models.s3.amazonaws.com/pi_lm_step_5000.pt
          wget https://opennmt-models.s3.amazonaws.com/transliteration-aren-all.tar.gz
          tar xf transliteration-aren-all.tar.gz

      - name: Test AddressSanitizer
        env:
          CT2_USE_MKL: 1
        run: |
          ASAN_OPTIONS=detect_leaks=1:print_stats=1 tests/ctranslate2_test tests/data
          
  build-and-test-cpp-arm64:
    runs-on: ${{ matrix.os }}
    env:
      CT2_VERBOSE: 1
    strategy:
      matrix:

        include:
          - os: ubuntu-24.04-arm
            backend: openblas
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build with OpenBLAS and Ruy
        if: matrix.backend == 'openblas'
        run: |
          wget https://github.com/xianyi/OpenBLAS/archive/v0.3.13.tar.gz
          tar xzvf v0.3.13.tar.gz
          cd OpenBLAS-0.3.13
          make TARGET=ARMV8 NO_LAPACK=1 -j $(nproc)
          sudo make PREFIX=/usr/local install -j $(nproc)
          cd ..
          export OpenBLAS_HOME=/usr/local
          cmake \
            -DOPENMP_RUNTIME=COMP \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DWITH_MKL=OFF \
            -DWITH_OPENBLAS=ON \
            -DWITH_RUY=ON \
            -DBUILD_TESTS=ON \
            .
          make -j $(nproc) install

      - name: Build Ruy
        if: matrix.backend == 'ruy'
        run: |
          CMAKE_EXTRA_OPTIONS='-DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_ACCELERATE=ON -DWITH_MKL=OFF -DOPENMP_RUNTIME=NONE -DWITH_RUY=ON'
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DBUILD_TESTS=ON \
            $CMAKE_EXTRA_OPTIONS \
            .
          make -j $(nproc) install

      - name: Download test data
        run: |
          wget https://opennmt-models.s3.amazonaws.com/transliteration-aren-all.tar.gz
          tar xf transliteration-aren-all.tar.gz -C tests/data/models/

      - name: Test
        run: |
          tests/ctranslate2_test tests/data

  build-python-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        arch: [auto64]
        include:
        - os: ubuntu-24.04-arm
          arch: aarch64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache MKL and oneDNN (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            C:/Program Files (x86)/Intel/oneAPI
            C:/Program Files (x86)/oneDNN
          key: windows-mkl-onednn-${{ hashFiles('python/tools/prepare_build_environment_windows.sh') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        with:
          package-dir: python
          output-dir: python/wheelhouse
        env:
          CIBW_ENVIRONMENT_PASS_LINUX: CIBW_ARCHS
          CIBW_ENVIRONMENT_WINDOWS: CTRANSLATE2_ROOT='${{ github.workspace }}\install'
          CIBW_ENVIRONMENT_MACOS: "CTRANSLATE2_ROOT='/usr/local' MACOSX_DEPLOYMENT_TARGET=11.00"
          CIBW_BEFORE_ALL_LINUX: python/tools/prepare_build_environment_linux.sh
          CIBW_BEFORE_ALL_MACOS: python/tools/prepare_build_environment_macos.sh
          CIBW_BEFORE_ALL_WINDOWS: bash python/tools/prepare_build_environment_windows.sh
          CIBW_BEFORE_BUILD: pip install -r python/install_requirements.txt
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: "*-musllinux_*"

      - name: Upload Python wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ runner.os }}-${{ matrix.arch }}
          path: python/wheelhouse

  build-python-wheels-rocm:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache MKL and oneDNN (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            C:/Program Files (x86)/Intel/oneAPI
            C:/Program Files (x86)/oneDNN
          key: windows-mkl-onednn-${{ hashFiles('python/tools/prepare_build_environment_windows_rocm.sh') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        with:
          package-dir: python
          output-dir: python/wheelhouse
        env:
          CIBW_ENVIRONMENT_LINUX: ROCM_PATH=/opt/rocm LD_LIBRARY_PATH=/opt/rocm/lib/llvm/lib:$LD_LIBRARY_PATH
          CIBW_ENVIRONMENT_WINDOWS: CTRANSLATE2_ROOT='${{ github.workspace }}\install'
          CIBW_BEFORE_ALL_LINUX: python/tools/prepare_build_environment_linux_rocm.sh
          CIBW_BEFORE_ALL_WINDOWS: bash python/tools/prepare_build_environment_windows_rocm.sh
          CIBW_BEFORE_BUILD: pip install -r python/install_requirements.txt
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: 'auditwheel repair -w {dest_dir} --exclude "/opt/rocm/lib/lib*" {wheel}'

      - name: Upload Python wheels
        uses: actions/upload-artifact@v7
        with:
          name: rocm-python-wheels-${{ runner.os }}
          path: python/wheelhouse


  # We could test the Python wheels using cibuildwheel but we prefer to run the tests outside
  # the build environment to ensure wheels correctly embed all dependencies.
  test-python-wheels:
    needs: [build-python-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_pattern: python-wheels-Linux-auto64
            wheel_pattern: "*cp3*manylinux*x86_64.whl"

          - os: ubuntu-24.04-arm
            artifact_pattern: python-wheels-Linux-aarch64
            wheel_pattern: "*cp3*manylinux*_aarch64.whl"

          - os: windows-2022
            artifact_pattern: python-wheels-Windows-auto64
            wheel_pattern: "*cp3*win*amd64.whl"

    steps:
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/checkout@v6

      - name: Prepare test environment
        shell: bash
        run: |
          ./python/tools/prepare_test_environment.sh

      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifact_pattern }}
          merge-multiple: true
          path: .

      - name: Install wheel
        shell: bash
        run: |
          pip install ${{ matrix.wheel_pattern }}

      - name: Test Python wheel
        run: |
          pytest -v python/tests/ --ignore=python/tests/test_fairseq.py --ignore=python/tests/test_opennmt_py.py --ignore=python/tests/test_opennmt_tf.py


  test-legacy-converters:
    needs: [build-python-wheels]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-Linux-auto64
          merge-multiple: true
          path: .

      - name: Install wheel and legacy dependencies
        run: |
          pip install 'pip<24.1'
          pip install *cp310*manylinux*x86_64.whl
          pip install -r python/tests/requirements-legacy.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade hydra-core

      - name: Download test data
        run: |
          curl -o transliteration-aren-all.tar.gz https://opennmt-models.s3.amazonaws.com/transliteration-aren-all.tar.gz
          tar xf transliteration-aren-all.tar.gz -C tests/data/models/
          rm transliteration-aren-all.tar.gz

      - name: Test legacy converters
        env:
          TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: 1
        run: |
          pytest -v python/tests/test_fairseq.py python/tests/test_opennmt_py.py python/tests/test_opennmt_tf.py -p no:hydra

  check-python-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install black==22.* flake8==7.* isort==5.*

      - name: Check code format with Black
        working-directory: python
        run: |
          black --check .

      - name: Check imports order with isort
        working-directory: python
        run: |
          isort --check-only .

      - name: Check code style with Flake8
        working-directory: python
        if: ${{ always() }}
        run: |
          flake8 .


  build-and-deploy-docs:
    runs-on: ubuntu-latest
    needs: [check-python-style, build-python-wheels, build-python-wheels-rocm]

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Download CTranslate2 wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-${{ runner.os }}-*
          merge-multiple: true
          path: .
      - name: Download CTranslate2 Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: wheels
      - name: Install CTranslate2 wheel
        run: |
          pip install *cp3*manylinux*x86_64.whl
      - name: Install dependencies to build docs
        working-directory: docs
        run: |
          python -m pip install -r requirements.txt
      - name: Build docs
        working-directory: docs
        run: |
          python generate.py python
          sphinx-build . build
      - name: Deploy docs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/build
          clean: true
      - name: Download ROCm wheels and zip for release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-zips

          gh run download ${{ github.run_id }} \
            --name rocm-python-wheels-Linux \
            --dir temp-linux
          zip -r release-zips/rocm-python-wheels-Linux.zip temp-linux/*
          rm -rf temp-linux

          gh run download ${{ github.run_id }} \
            --name rocm-python-wheels-Windows \
            --dir temp-windows
          zip -r release-zips/rocm-python-wheels-Windows.zip temp-windows/*
          rm -rf temp-windows

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files:
            release-zips/*.zip
            wheels/*.whl
